<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e7e9ea;
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0f1419; }
  header .who { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select, button { background: #202327; color: #e7e9ea; border: 1px solid #333639;
    border-radius: 8px; padding: 6px 8px; font: inherit; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  video { max-width: 100%; max-height: 100%; width: 100%; background: #000; }
  .text { padding: 10px 14px 14px; background: #0f1419; max-height: 25vh; overflow: auto;
    white-space: pre-wrap; opacity: .9; }
  .err { padding: 24px; text-align: center; }
</style>
</head>
<body>
  <header>
    <span class="who" id="who">Video</span>
    <select id="quality" aria-label="Quality"></select>
    <button id="close" type="button">Close</button>
  </header>
  <main id="main"><video id="v" controls autoplay playsinline></video></main>
  <div class="text" id="slow" hidden>Still loading. Check your connection, or pick a lower quality above.</div>
  <div class="text" id="text" hidden></div>
  <script src="player.js"></script>
</body>
</html>
